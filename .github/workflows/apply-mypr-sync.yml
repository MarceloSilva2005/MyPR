name: Apply corrected MyPR project

on:
  push:
    branches: [main]
    paths:
      - ".mypr-sync.zip"
      - ".github/workflows/apply-mypr-sync.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply corrected project files
        run: |
          rm -rf /tmp/mypr-sync
          mkdir -p /tmp/mypr-sync
          unzip -q -o .mypr-sync.zip -d /tmp/mypr-sync
          rsync -a /tmp/mypr-sync/ ./
          rm -f .mypr-sync.zip
          rm -f .github/workflows/apply-mypr-sync.yml

      - name: Commit corrected project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Apply corrected project"
          git push
