name: Visual baselines

# Regenerates the reference screenshots on Linux, where fonts render reproducibly. Run it manually
# on a branch after an intentional visual change, review the images, and commit them.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baselines:
    name: baselines
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Generate screenshots
        run: pnpm exec playwright test e2e/visual.spec.ts --update-snapshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines
          path: e2e/visual.spec.ts-snapshots/
          retention-days: 14
