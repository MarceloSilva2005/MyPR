name: Apply remaining corrected files

on:
  push:
    branches: [main]
    paths:
      - ".remaining.patch.gz"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply corrections
        run: |
          sed -i 's/\r$//' src/components/mypr/profile-view.tsx
          sed -i 's/\r$//' src/components/mypr/workout-editor.tsx
          sed -i 's/\r$//' src/lib/db.ts
          gzip -dc .remaining.patch.gz > /tmp/remaining.patch
          git apply --ignore-space-change --ignore-whitespace /tmp/remaining.patch
      - name: Commit corrected files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/mypr/profile-view.tsx src/components/mypr/workout-editor.tsx src/lib/db.ts
          git commit -m "Apply remaining code fixes"
          git push
