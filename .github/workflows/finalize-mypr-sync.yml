name: Finalize MyPR sync

on:
  push:
    branches: [main]
    paths:
      - ".sync/**"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild corrected files
        run: |
          cat .sync/profile.1 .sync/profile.2 | base64 -d | gzip -d > src/components/mypr/profile-view.tsx
          cat .sync/editor.1 .sync/editor.2 | base64 -d | gzip -d > src/components/mypr/workout-editor.tsx
          cat .sync/db.1 .sync/db.2 | base64 -d | gzip -d > src/lib/db.ts
          rm -rf .sync
          rm -f .mypr-sync.zip .remaining.patch.gz
          rm -f .github/workflows/apply-mypr-sync.yml .github/workflows/apply-remaining-fixes.yml
          rm -f .github/workflows/finalize-mypr-sync.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply corrected MyPR project"
          git push
