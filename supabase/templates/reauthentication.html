<!doctype html>
<html lang="pt-BR">
  <body
    style="
      margin: 0;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: #1f2328;
      background: #ffffff;
    "
  >
    <div style="max-width: 480px">
      <p style="font-size: 18px; font-weight: bold; margin: 0 0 24px">MyPR</p>
      <h1 style="font-size: 18px; margin: 0 0 12px">Código de confirmação</h1>
      <p style="font-size: 15px; line-height: 1.5; margin: 0 0 20px">
        Use este código para confirmar a alteração na sua conta no MyPR:
      </p>
      <p style="font-size: 24px; font-weight: bold; letter-spacing: 4px; margin: 0 0 20px">
        {{ .Token }}
      </p>
      <p style="font-size: 13px; color: #59636e; margin: 0">O código vale por 1 hora.</p>
      <p style="font-size: 13px; color: #59636e; margin: 32px 0 0">
        Se você não fez este pedido, ignore este e-mail. Nenhuma alteração será feita.
      </p>
    </div>
  </body>
</html>
