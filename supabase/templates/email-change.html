<!doctype html>
<html lang="pt-BR">
  <body
    style="
      margin: 0;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: #1f2328;
      background: #ffffff;
    "
  >
    <div style="max-width: 480px">
      <p style="font-size: 18px; font-weight: bold; margin: 0 0 24px">MyPR</p>
      <h1 style="font-size: 18px; margin: 0 0 12px">Confirme o novo e-mail</h1>
      <p style="font-size: 15px; line-height: 1.5; margin: 0 0 20px">
        Use o botão abaixo para confirmar {{ .NewEmail }} como o novo e-mail da sua conta no MyPR.
      </p>
      <p style="margin: 0 0 20px">
        <a
          href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email_change"
          style="
            display: inline-block;
            padding: 10px 16px;
            background: #2747c4;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 15px;
          "
          >Confirmar novo e-mail</a
        >
      </p>
      <p style="font-size: 13px; color: #59636e; margin: 0">
        O link vale por 10 minutos e pode ser usado uma vez.
      </p>
      <p style="font-size: 13px; color: #59636e; margin: 32px 0 0">
        Se você não fez este pedido, ignore este e-mail. Nenhuma alteração será feita.
      </p>
    </div>
  </body>
</html>
