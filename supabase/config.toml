# Local development stack. Hosted projects are configured in the provider
# dashboard; keep the security-relevant values below in sync with them
# (see docs/security/asvs.md).
project_id = "mypr"

[api]
enabled = true
port = 54321
# Only the application schema is exposed. Helpers live in `private`.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Captures every e-mail sent by Auth locally (web UI on this port).
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**", "http://localhost:3100/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
# ASVS 5.0 6.2.1: at least 8 characters, no composition rules.
minimum_password_length = 8
password_requirements = ""

[auth.rate_limit]
email_sent = 30
sign_in_sign_ups = 30
token_refresh = 150
token_verifications = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
# Accounts must confirm their address before reaching the application.
enable_confirmations = true
# Changing the password requires a recent sign-in.
secure_password_change = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

# E-mails in Brazilian Portuguese. Every link opens a page that asks for a
# button press before using the token (src/app/(auth)/auth/confirm).
[auth.email.template.confirmation]
subject = "Confirme seu e-mail no MyPR"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Criar nova senha no MyPR"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirme o novo e-mail no MyPR"
content_path = "./supabase/templates/email-change.html"

[auth.email.template.reauthentication]
subject = "Código de confirmação do MyPR"
content_path = "./supabase/templates/reauthentication.html"
